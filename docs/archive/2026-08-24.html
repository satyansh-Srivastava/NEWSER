<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glueball -- Monday, August 24, 2026</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --text-muted: #555555;
    --border: #dddddd;
    --accent: #0645ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size: 15px;
    line-height: 1.45;
  }
  a { color: var(--accent); }
  header {
    border-bottom: 2px solid var(--text);
    padding: 0.9rem 1rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  header h1 {
    margin: 0;
    font-size: 1.3rem;
    letter-spacing: -0.01em;
  }
  header .meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  nav.toc {
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.78rem;
  }
  nav.toc a {
    margin-right: 0.9rem;
    text-decoration: none;
    color: var(--text-muted);
    white-space: nowrap;
  }
  nav.toc a:hover { color: var(--accent); }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem;
  }
  section.tag-section { margin-bottom: 1.6rem; }
  section.tag-section h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 0.5rem;
    padding-bottom: 0.25rem;
    border-bottom: 1px solid var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  section.tag-section h2 .count { color: var(--text-muted); font-weight: 400; }
  .brief-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 0.75rem;
  }
  .brief {
    border: 1px solid var(--border);
    padding: 0.65rem 0.8rem;
  }
  .brief h3 {
    margin: 0 0 0.3rem;
    font-size: 0.98rem;
    line-height: 1.3;
  }
  .brief h3 a { color: var(--text); text-decoration: none; }
  .brief h3 a:hover { color: var(--accent); text-decoration: underline; }
  .brief p { margin: 0.25rem 0; }
  .brief p strong { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-right: 0.3rem; }
  .brief .footer-row {
    margin-top: 0.4rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
  }
  .brief .tags { color: var(--text-muted); }
  .brief .source-link { text-decoration: none; }
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 3rem 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  footer {
    border-top: 1px solid var(--border);
    padding: 0.8rem 1rem 1.5rem;
    color: var(--text-muted);
    font-size: 0.75rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  footer a { color: var(--text-muted); }
  @media (max-width: 480px) {
    .brief-grid { grid-template-columns: 1fr; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<header>
  <h1>Glueball</h1>
  <span class="meta">Monday, August 24, 2026 &middot; generated 23:13 UTC &middot; 0 briefs</span>
</header>



<main>
  
  <p class="empty-state">No qualifying stories today.</p>
  

  
</main>

<footer>
  <p>Glueball &middot; autonomous daily AI digest, no runtime admin, config-driven (see config.yaml) &middot; <a href="./archive/index.html">archive</a></p>
</footer>
</body>
</html>
