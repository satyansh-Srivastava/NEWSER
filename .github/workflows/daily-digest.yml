name: Glueball Daily Digest

on:
  schedule:
    # 23:00 UTC every day -- keep in sync with config.yaml's schedule_cron
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: glueball-daily-digest
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # spec's 15-minute pipeline budget + margin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the Glueball pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --output-dir docs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs runs ISSUES.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily digest: $(date -u +%Y-%m-%d)"
            git push
          fi
